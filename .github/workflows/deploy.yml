name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install d2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Warm up d2's Chromium (for PNG rendering)
        run: |
          npx --yes playwright@1.48.0 install-deps chromium
          echo "a" > /tmp/d2-warm.d2
          echo y | d2 /tmp/d2-warm.d2 /tmp/d2-warm.png
          rm -f /tmp/d2-warm.d2 /tmp/d2-warm.png

      - name: Compile d2 files to SVG
        run: |
          failed=""
          while read -r f; do
            if ! d2 "$f" "${f%.d2}.svg"; then
              echo "::error file=$f::d2 compile failed for $f"
              failed="$failed $f"
            fi
          done < <(find . \( -path ./node_modules -o -path ./dist -o -path ./src -o -path ./.git -o -path ./.github \) -prune -o -name "*.d2" -print)
          if [ -n "$failed" ]; then
            echo "d2 compile failed for:$failed"
            exit 1
          fi

      - name: Generate scenario manifests
        run: node scripts/build-scenario-manifests.mjs

      - name: Generate tags manifest
        run: node scripts/build-tags-manifest.mjs

      - name: Build frontend
        run: bun run build
        env:
          CI: false

      - name: Copy diagram sources into dist
        run: |
          SKIP_DIRS="node_modules dist src .git .github public icons scripts"
          for dir in */; do
            dir="${dir%/}"
            skip=false
            for s in $SKIP_DIRS; do [ "$dir" = "$s" ] && skip=true && break; done
            $skip && continue
            has_diagrams=$(find "$dir" \( -name '*.d2' -o -name '*.mmd' \) -print -quit)
            [ -z "$has_diagrams" ] && continue
            mkdir -p "dist/$dir"
            rsync -a --exclude='*.d2' --exclude='*.mmd' "$dir/" "dist/$dir/"
            find "$dir" \( -name '*.d2' -o -name '*.mmd' \) | while read -r f; do
              cp "$f" "dist/$f.txt"
            done
          done
          find . -maxdepth 1 -name '*.d2' | while read -r f; do
            svg="${f%.d2}.svg"
            [ -f "$svg" ] && cp "$svg" dist/
            cp "$f" "dist/$f.txt"
          done
          cp pointers.yaml dist/
          cp dist/index.html dist/404.html

      - name: Generate social link-preview pages
        run: node scripts/build-social-previews.mjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
